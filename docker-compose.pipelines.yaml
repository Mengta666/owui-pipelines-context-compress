services:
  pipelines:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MINIMUM_BUILD: "${MINIMUM_BUILD:-true}"
    image: "${PIPELINES_IMAGE:-my-openwebui-pipelines:local}"
    container_name: "${PIPELINES_CONTAINER_NAME:-pipelines}"
    restart: "${PIPELINES_RESTART_POLICY:-no}"

    ports:
      - "${PIPELINES_PORT:-9099}:9099"

    environment:
      PIPELINES_API_KEY: "${PIPELINES_API_KEY:-0p3n-w3bu!}"
      MINI_AGENT_DEBUG: "${MINI_AGENT_DEBUG:-true}"
      MINI_AGENT_MODEL_API_BASE_URL: "${MINI_AGENT_MODEL_API_BASE_URL:-http://host.docker.internal:11434/v1}"
      MINI_AGENT_MODEL_API_KEY: "${MINI_AGENT_MODEL_API_KEY:-}"
      MINI_AGENT_TARGET_MODEL: "${MINI_AGENT_TARGET_MODEL:-}"
      MINI_AGENT_SUMMARY_MODEL: "${MINI_AGENT_SUMMARY_MODEL:-}"
      MINI_AGENT_WORKSPACE_ROOT: "${MINI_AGENT_WORKSPACE_ROOT:-/app/pipelines/agent_workspace}"
      MINI_AGENT_OPENWEBUI_UPLOADS_ROOT: "${MINI_AGENT_OPENWEBUI_UPLOADS_ROOT:-/app/backend/data/uploads}"
      MINI_AGENT_PIPELINE_MOUNTED_UPLOADS_ROOT: "${MINI_AGENT_PIPELINE_MOUNTED_UPLOADS_ROOT:-}"
      MINI_AGENT_ENFORCE_UPLOAD_ROOT: "${MINI_AGENT_ENFORCE_UPLOAD_ROOT:-true}"
      MINI_AGENT_FILE_REGISTRATION_MODE: "${MINI_AGENT_FILE_REGISTRATION_MODE:-reference}"
      MINI_AGENT_MAX_AGENT_STEPS: "${MINI_AGENT_MAX_AGENT_STEPS:-8}"
      MINI_AGENT_REQUEST_TIMEOUT_SEC: "${MINI_AGENT_REQUEST_TIMEOUT_SEC:-120}"
      MINI_AGENT_MODEL_TEMPERATURE: "${MINI_AGENT_MODEL_TEMPERATURE:-0.1}"
      MINI_AGENT_SUMMARY_TEMPERATURE: "${MINI_AGENT_SUMMARY_TEMPERATURE:-0.1}"
      MINI_AGENT_MAX_OUTPUT_TOKENS: "${MINI_AGENT_MAX_OUTPUT_TOKENS:-2200}"
      MINI_AGENT_SUMMARY_MAX_TOKENS: "${MINI_AGENT_SUMMARY_MAX_TOKENS:-1800}"
      MINI_AGENT_MAX_CONTEXT_TOKENS: "${MINI_AGENT_MAX_CONTEXT_TOKENS:-32768}"
      MINI_AGENT_RESERVED_OUTPUT_TOKENS: "${MINI_AGENT_RESERVED_OUTPUT_TOKENS:-8000}"
      MINI_AGENT_AUTOCOMPACT_BUFFER_TOKENS: "${MINI_AGENT_AUTOCOMPACT_BUFFER_TOKENS:-4000}"
      MINI_AGENT_LIGHTCOMPACT_BUFFER_TOKENS: "${MINI_AGENT_LIGHTCOMPACT_BUFFER_TOKENS:-12000}"
      MINI_AGENT_MAX_CONSECUTIVE_COMPACTION_FAILURES: "${MINI_AGENT_MAX_CONSECUTIVE_COMPACTION_FAILURES:-3}"
      MINI_AGENT_KEEP_FIRST_MESSAGES: "${MINI_AGENT_KEEP_FIRST_MESSAGES:-4}"
      MINI_AGENT_KEEP_LAST_MESSAGES: "${MINI_AGENT_KEEP_LAST_MESSAGES:-8}"
      MINI_AGENT_KEEP_LAST_USER_MESSAGES: "${MINI_AGENT_KEEP_LAST_USER_MESSAGES:-6}"
      MINI_AGENT_EMERGENCY_TAIL_KEEP_MESSAGES: "${MINI_AGENT_EMERGENCY_TAIL_KEEP_MESSAGES:-4}"
      MINI_AGENT_TOKENIZER_ENCODING: "${MINI_AGENT_TOKENIZER_ENCODING:-o200k_base}"
      MINI_AGENT_FILE_EXCERPT_CHARS: "${MINI_AGENT_FILE_EXCERPT_CHARS:-1200}"
      MINI_AGENT_TOOL_MAX_RESULTS: "${MINI_AGENT_TOOL_MAX_RESULTS:-20}"
      MINI_AGENT_TOOL_MAX_FILE_CHARS: "${MINI_AGENT_TOOL_MAX_FILE_CHARS:-200000}"
      MINI_AGENT_TOOL_MAX_TRANSCRIPT_CHARS: "${MINI_AGENT_TOOL_MAX_TRANSCRIPT_CHARS:-120000}"
      MINI_AGENT_TOOL_RESULT_INLINE_BUDGET_CHARS: "${MINI_AGENT_TOOL_RESULT_INLINE_BUDGET_CHARS:-12000}"
      MINI_AGENT_LIGHTCOMPACT_MAX_SUMMARY_LINES: "${MINI_AGENT_LIGHTCOMPACT_MAX_SUMMARY_LINES:-6}"
      MINI_AGENT_LIGHTCOMPACT_LINE_CHARS: "${MINI_AGENT_LIGHTCOMPACT_LINE_CHARS:-180}"
      MINI_AGENT_SUMMARY_INPUT_MAX_CHARS: "${MINI_AGENT_SUMMARY_INPUT_MAX_CHARS:-50000}"
      MINI_AGENT_SUMMARY_USER_MESSAGE_MAX_CHARS: "${MINI_AGENT_SUMMARY_USER_MESSAGE_MAX_CHARS:-2000}"
      MINI_AGENT_SUMMARY_EVENT_MAX_CHARS: "${MINI_AGENT_SUMMARY_EVENT_MAX_CHARS:-1200}"
      MINI_AGENT_PROMPT_HISTORY_MAX_CHARS: "${MINI_AGENT_PROMPT_HISTORY_MAX_CHARS:-10000}"
      MINI_AGENT_PROMPT_HISTORY_TOTAL_RATIO: "${MINI_AGENT_PROMPT_HISTORY_TOTAL_RATIO:-1.5}"
      MINI_AGENT_ENABLE_HISTORY_COMPACTION: "${MINI_AGENT_ENABLE_HISTORY_COMPACTION:-true}"

    volumes:
      - pipelines-data:/app/pipelines
      - open-webui-data:/app/backend/data:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

  pipelines-chat-cache-gc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MINIMUM_BUILD: "${MINIMUM_BUILD:-true}"
    image: "${PIPELINES_IMAGE:-my-openwebui-pipelines:local}"
    container_name: "${PIPELINES_GC_CONTAINER_NAME:-pipelines-chat-cache-gc}"
    restart: "${PIPELINES_GC_RESTART_POLICY:-unless-stopped}"

    entrypoint: ["bash", "/app/scripts/openwebui_chat_cache_gc.sh"]

    environment:
      MINI_AGENT_WORKSPACE_ROOT: "${MINI_AGENT_WORKSPACE_ROOT:-/app/pipelines/agent_workspace}"
      OPENWEBUI_API_BASE_URL: "${OPENWEBUI_API_BASE_URL:-http://host.docker.internal:3000}"
      OPENWEBUI_CHAT_CHECK_URL_TEMPLATE: "${OPENWEBUI_CHAT_CHECK_URL_TEMPLATE:-}"
      OPENWEBUI_API_TOKEN: "${OPENWEBUI_API_TOKEN:-}"
      OPENWEBUI_API_AUTH_HEADER: "${OPENWEBUI_API_AUTH_HEADER:-Authorization}"
      OPENWEBUI_API_TOKEN_SCHEME: "${OPENWEBUI_API_TOKEN_SCHEME:-Bearer}"
      CHAT_CACHE_GC_SESSION_ROOT: "${CHAT_CACHE_GC_SESSION_ROOT:-}"
      CHAT_CACHE_GC_INTERVAL_SEC: "${CHAT_CACHE_GC_INTERVAL_SEC:-1800}"
      CHAT_CACHE_GC_MIN_AGE_SEC: "${CHAT_CACHE_GC_MIN_AGE_SEC:-600}"
      CHAT_CACHE_GC_REQUEST_TIMEOUT_SEC: "${CHAT_CACHE_GC_REQUEST_TIMEOUT_SEC:-10}"
      CHAT_CACHE_GC_DRY_RUN: "${CHAT_CACHE_GC_DRY_RUN:-false}"
      CHAT_CACHE_GC_RUN_ONCE: "${CHAT_CACHE_GC_RUN_ONCE:-false}"

    volumes:
      - pipelines-data:/app/pipelines

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pipelines-data:
    name: "${PIPELINES_VOLUME_NAME:-pipelines-data}"
  open-webui-data:
    external: true
    name: "${OPEN_WEBUI_DATA_VOLUME:-open-webui_open-webui}"
